<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Reply Guy Repellent</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #0f1419;
      --muted: #536471;
      --line: #eff3f4;
      --track: #cfd9de;
      --accent: #1d9bf0;
      --seg-bg: #eff3f4;
      --seg-on: #ffffff;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #15181c;
        --fg: #e7e9ea;
        --muted: #8b98a5;
        --line: #2f3336;
        --track: #3e4144;
        --seg-bg: #202327;
        --seg-on: #3a3d41;
      }
    }
    * { box-sizing: border-box; }
    body {
      width: 300px;
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 16px 12px;
    }
    header img { width: 28px; height: 28px; }
    h1 { margin: 0; font-size: 15px; font-weight: 700; }
    .count {
      padding: 4px 16px 16px;
      border-bottom: 1px solid var(--line);
    }
    .count strong {
      display: block;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }
    .count span { color: var(--muted); font-size: 13px; }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
    }
    .row small { display: block; color: var(--muted); font-size: 12px; }
    .switch { position: relative; flex: none; width: 40px; height: 24px; }
    .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
    .switch span {
      position: absolute; inset: 0; border-radius: 12px; background: var(--track);
      transition: background 150ms; pointer-events: none;
    }
    .switch span::after {
      content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px;
      border-radius: 50%; background: #fff; transition: transform 150ms;
    }
    .switch input:checked + span { background: var(--accent); }
    .switch input:checked + span::after { transform: translateX(16px); }
    .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
    .seg {
      display: flex; flex: none; padding: 2px; border-radius: 9px; background: var(--seg-bg);
    }
    .seg button {
      border: 0; background: none; color: var(--muted); font: inherit; font-size: 12px; font-weight: 600;
      padding: 5px 10px; border-radius: 7px; cursor: pointer;
    }
    .seg button[aria-pressed="true"] {
      background: var(--seg-on); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.12);
    }
    body.off .dim { opacity: .45; pointer-events: none; }
    footer { padding: 12px 16px 14px; font-size: 12px; color: var(--muted); }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <img src="icons/48.png" alt="">
    <h1>Reply Guy Repellent</h1>
  </header>

  <div class="count">
    <strong id="allTime">0</strong>
    <span>low-effort replies hidden, all-time</span>
  </div>

  <label class="row">
    <div>On<small>Collapse low-effort replies on X</small></div>
    <span class="switch"><input type="checkbox" id="enabled"><span></span></span>
  </label>

  <div class="row dim">
    <div>Strictness</div>
    <div class="seg" id="strictness" role="group" aria-label="Strictness">
      <button type="button" data-value="low">Low</button>
      <button type="button" data-value="medium">Medium</button>
      <button type="button" data-value="high">High</button>
    </div>
  </div>

  <label class="row dim">
    <div>Smart scoring (Jev)<small>Checks borderline replies. Off = keywords only</small></div>
    <span class="switch"><input type="checkbox" id="useJev"><span></span></span>
  </label>

  <footer>by <a href="https://x.com/chaosengineerr" target="_blank" rel="noopener">@chaosengineerr</a></footer>

  <script src="popup.js"></script>
</body>
</html>
